services:
  - type: web
    name: visioninspect-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: VISIONINSPECT_TOKEN_SECRET
        generateValue: true
